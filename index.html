<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>oisu</title>
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #F7E2C2;
    --ink: #10192E;
    --ink-soft: #55607A;
    --panel: #FFFFFF;
    --accent: #6C5CE7;
    --accent-soft: #E7E3FB;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  canvas {
    position: fixed;
    inset: 0;
    display: block;
    cursor: crosshair;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
</style>
</head>
<body>

<canvas id="world"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Render, Runner, Bodies, Body, Composite, Events, Common } = Matter;

const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();

const engine = Engine.create();
engine.gravity.y = 1;
const world = engine.world;

const WALL_OPTS = { isStatic: true, render: { visible: false } };
let ground, leftWall, rightWall;

function buildBounds() {
  Composite.remove(world, [ground, leftWall, rightWall].filter(Boolean));
  const t = 60;
  ground = Bodies.rectangle(canvas.width/2, canvas.height + t/2 - 8, canvas.width + t*2, t, WALL_OPTS);
  leftWall = Bodies.rectangle(-t/2 + 4, canvas.height/2, t, canvas.height*3, WALL_OPTS);
  rightWall = Bodies.rectangle(canvas.width + t/2 - 4, canvas.height/2, t, canvas.height*3, WALL_OPTS);
  Composite.add(world, [ground, leftWall, rightWall]);
}
buildBounds();

window.addEventListener('resize', () => {
  resize();
  buildBounds();
});

// --- Image setup ---
const IMG_SRC = "nice.png";
const IMG_ASPECT = 0.8899; // width / height
const img = new Image();
let imgLoaded = false;
img.onload = () => { imgLoaded = true; };
img.src = IMG_SRC;

const bodyMeta = new Map();

function spawnObject(x, y) {
  // collision radius: base size with slight random variety
  const baseDiameter = Common.random(36, 54);
  const radius = baseDiameter / 2;

  const body = Bodies.circle(x, y, radius, {
    restitution: 0.5,
    friction: 0.2,
    frictionAir: 0.0015,
    density: 0.0022,
    angle: Common.random(0, Math.PI * 2)
  });

  // draw size follows image aspect ratio, fit within a circle of this radius
  // scale so the larger of width/height roughly matches diameter * 1.15 (slight overhang looks natural for plush ears etc)
  const drawH = baseDiameter * 1.25;
  const drawW = drawH * IMG_ASPECT;

  bodyMeta.set(body.id, { drawW, drawH, squash: 1 });
  Composite.add(world, body);
}

Events.on(engine, 'collisionStart', (event) => {
  for (const pair of event.pairs) {
    const isGroundHit = pair.bodyA === ground || pair.bodyB === ground;
    for (const b of [pair.bodyA, pair.bodyB]) {
      const meta = bodyMeta.get(b.id);
      if (meta) {
        const speed = Math.min(Math.hypot(b.velocity.x, b.velocity.y), 18);
        if (speed > 1.5) {
          // ground landings squish a bit more than plushie-on-plushie bumps
          const strength = isGroundHit ? speed / 24 : speed / 34;
          meta.squash = Math.max(isGroundHit ? 0.6 : 0.72, 1 - strength);
        }
      }
    }
  }
});

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const bodies = Composite.allBodies(world);
  for (const body of bodies) {
    const meta = bodyMeta.get(body.id);
    if (!meta) continue;

    meta.squash += (1 - meta.squash) * 0.2;

    const { x, y } = body.position;
    const angle = body.angle;

    // world-aligned squash: flattens downward regardless of the
    // plushie's current tumble angle, so landings read as a real squish
    // against the floor instead of a squish along a spinning axis
    const scaleY = meta.squash;
    const scaleX = 1 + (1 - meta.squash) * 0.6;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, scaleY);
    ctx.rotate(angle);

    ctx.shadowColor = 'rgba(16,25,46,0.22)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 4;

    if (imgLoaded) {
      ctx.drawImage(img, -meta.drawW/2, -meta.drawH/2, meta.drawW, meta.drawH);
    }

    ctx.restore();
  }

  requestAnimationFrame(render);
}

const runner = Runner.create();
Runner.run(runner, engine);
render();

// --- UI wiring ---
const HOLD_DELAY = 350;   // time holding before repeat-spawn kicks in
const SPAWN_COOLDOWN = 70; // ms between repeated spawns while holding

let holdTimeout = null;
let spawnInterval = null;
let lastPointer = { x: 0, y: 0 };
let activePointerId = null;

function startHold(x, y) {
  lastPointer.x = x;
  lastPointer.y = y;
  spawnObject(x, y); // immediate spawn on click

  holdTimeout = setTimeout(() => {
    spawnInterval = setInterval(() => {
      // small horizontal jitter so repeated spawns don't stack in a perfect column
      const jitter = Common.random(-14, 14);
      spawnObject(lastPointer.x + jitter, lastPointer.y);
    }, SPAWN_COOLDOWN);
  }, HOLD_DELAY);
}

function stopHold() {
  clearTimeout(holdTimeout);
  clearInterval(spawnInterval);
  holdTimeout = null;
  spawnInterval = null;
  activePointerId = null;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault(); // stop mobile browsers from treating this as a zoom/scroll gesture
  stopHold();          // force-clear any stuck state from a previous touch before starting fresh
  activePointerId = e.pointerId;
  startHold(e.clientX, e.clientY);
}, { passive: false });

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== activePointerId) return;
  e.preventDefault();
  lastPointer.x = e.clientX;
  lastPointer.y = e.clientY;
}, { passive: false });

function handlePointerEnd(e) {
  if (activePointerId !== null && e.pointerId !== activePointerId) return;
  stopHold();
}

canvas.addEventListener('pointerup', handlePointerEnd);
canvas.addEventListener('pointerleave', handlePointerEnd);
canvas.addEventListener('pointercancel', handlePointerEnd);

// safety nets: mobile browsers sometimes swallow pointerup/cancel events
// (e.g. when a system gesture interrupts the touch) without ever firing
// them on the canvas. These make sure holding never gets permanently stuck.
window.addEventListener('blur', stopHold);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopHold();
});
</script>
</body>
</html>
