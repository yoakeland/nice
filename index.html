<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>oisu</title>
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico?">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #F7E2C2;
    --ink: #10192E;
    --ink-soft: #55607A;
    --panel: #FFFFFF;
    --accent: #6C5CE7;
    --accent-soft: #E7E3FB;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  canvas {
    position: fixed;
    inset: 0;
    display: block;
    cursor: crosshair;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* secret button: invisible until hovered, tucked in the corner */
  #secretToggle {
    position: fixed;
    bottom: 0;
    right: 0;
    width: 34px;
    height: 34px;
    background: transparent;
    border: none;
    cursor: pointer;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.25s ease, background 0.25s ease;
  }
  #secretToggle:hover,
  #secretToggle:focus-visible {
    opacity: 1;
    background: var(--accent-soft);
  }

  #secretToast {
    position: fixed;
    bottom: 40px;
    right: 12px;
    padding: 10px 16px;
    border-radius: 12px;
    background: var(--ink);
    color: #FFF3B0;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.01em;
    box-shadow: 0 6px 18px rgba(16,25,46,0.3);
    z-index: 101;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #secretToast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* plushie counter — only shown once unlimited mode is on, slides in
     from off-screen rather than just fading in */
  #plushCounter {
    position: fixed;
    bottom: 18px;
    left: 18px;
    padding: 10px 18px;
    border-radius: 14px;
    background: var(--ink);
    color: #FFF3B0;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.01em;
    box-shadow: 0 6px 18px rgba(16,25,46,0.3);
    z-index: 90;
    pointer-events: none;
    transform: translateX(-140%);
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #plushCounter.show {
    transform: translateX(0);
  }
  #plushCounter b {
    color: #FFFDE7;
    font-size: 17px;
  }
</style>
</head>
<body>

<canvas id="world"></canvas>
<button id="secretToggle" aria-label="secret"></button>
<div id="secretToast"></div>
<div id="plushCounter"><b id="plushCount">0</b> plushies</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Render, Runner, Bodies, Body, Composite, Events, Common } = Matter;

const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
const plushCounter = document.getElementById('plushCounter');
const plushCount = document.getElementById('plushCount');
let lastPlushCountShown = -1; // avoids redundant DOM writes when the count hasn't changed

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();

const engine = Engine.create();
engine.gravity.y = 1;
const world = engine.world;

const WALL_OPTS = { isStatic: true, render: { visible: false } };
let ground, leftWall, rightWall;

function buildBounds() {
  Composite.remove(world, [ground, leftWall, rightWall].filter(Boolean));
  const t = 60;
  // ground is built extra-wide so it still spans the full play area even
  // at max zoom-out, once the walls below move far apart
  ground = Bodies.rectangle(canvas.width/2, canvas.height + t/2 - 8, canvas.width * 14, t, WALL_OPTS);
  leftWall = Bodies.rectangle(-t/2 + 4, canvas.height/2, t, canvas.height*3, WALL_OPTS);
  rightWall = Bodies.rectangle(canvas.width + t/2 - 4, canvas.height/2, t, canvas.height*3, WALL_OPTS);
  Composite.add(world, [ground, leftWall, rightWall]);
}
buildBounds();

// Moves the left/right walls outward in real physics coordinates as the
// camera zooms out, so the play area actually gets wider — not just drawn
// smaller. Solved so a wall stays pinned to the screen edge: for a world
// point at the camera's anchor x (canvas.width/2) the zoom doesn't move it,
// so the wall's world-x must shift by (screen half-width)/zoom to still
// land exactly at the visual edge.
function repositionWalls() {
  const cx = canvas.width / 2;
  Body.setPosition(leftWall, { x: cx - cx / cameraZoom, y: leftWall.position.y });
  Body.setPosition(rightWall, { x: cx + cx / cameraZoom, y: rightWall.position.y });
}

window.addEventListener('resize', () => {
  resize();
  buildBounds();
});

// --- Image setup ---
const IMG_SRC = "nice.png";
const IMG_ASPECT = 0.8899; // width / height
const img = new Image();
let imgLoaded = false;
img.onload = () => { imgLoaded = true; };
img.src = IMG_SRC;

// ultra-rare (1/250) alternate plushie
const RARE_IMG_SRC = "tannhauser.png";
const RARE_IMG_ASPECT = 0.6871; // width / height
const rareImg = new Image();
let rareImgLoaded = false;
rareImg.onload = () => { rareImgLoaded = true; };
rareImg.src = RARE_IMG_SRC;

const bodyMeta = new Map();
const spawnOrder = []; // tracks spawn order so we know which is oldest
const MAX_PLUSHIES = 100;
let unlimitedMode = false; // secret toggle — see #secretToggle

function spawnObject(x, y) {
  // enforce the cap by removing the oldest plushie before adding a new one
  // (skipped entirely when unlimitedMode is on)
  if (!unlimitedMode && spawnOrder.length >= MAX_PLUSHIES) {
    const oldestBody = spawnOrder.shift();
    if (oldestBody) {
      Composite.remove(world, oldestBody);
      bodyMeta.delete(oldestBody.id);
    }
  }

  // collision radius: base size with slight random variety
  const baseDiameter = Common.random(110, 150);
  const radius = baseDiameter / 2;

  const body = Bodies.circle(x, y, radius, {
    restitution: 0.35,
    friction: 0.7,
    frictionStatic: 1.2, // resists initial rolling once nestled against neighbors
    frictionAir: 0.0015,
    density: 0.0022,
    angle: Common.random(0, Math.PI * 2)
  });

  // rarity rolls, rarest first and mutually exclusive: 1-in-250 alternate
  // plushie image, otherwise 1-in-100 gold, otherwise 1-in-20 random color
  const isRareImage = Math.random() < 1 / 250;
  const isGold = !isRareImage && Math.random() < 1 / 100;
  const isRareColor = !isRareImage && !isGold && Math.random() < 1 / 20;

  // draw size follows image aspect ratio, drawn larger than the collision
  // circle so neighboring plushies visually overlap into the gap left
  // between touching circles (circles only touch at a single point,
  // so a tight fit here leaves visible empty space in a packed pile)
  const aspect = isRareImage ? RARE_IMG_ASPECT : IMG_ASPECT;
  const drawH = baseDiameter * 1.35;

  // tannhauser's art is naturally narrower/portrait-shaped than the round
  // main plushie, which read as "skinny" next to it even at the same
  // height. Deliberately widen it beyond its true aspect ratio here —
  // trading a bit of accuracy for a visual match with the rest of the pile.
  const widthBoost = isRareImage ? 1.3 : 1;
  const drawW = drawH * aspect * widthBoost;

  // Tint effects (gold / random color) only apply to the normal plushie —
  // rendered onto its own isolated offscreen canvas, since tinting directly
  // on the shared main canvas would paint over whatever pixels happen to
  // already be there (i.e. neighboring plushies), not just this one's shape.
  let spriteCanvas = null;
  if ((isGold || isRareColor) && imgLoaded) {
    spriteCanvas = document.createElement('canvas');
    spriteCanvas.width = img.naturalWidth;
    spriteCanvas.height = img.naturalHeight;
    const sctx = spriteCanvas.getContext('2d');
    sctx.drawImage(img, 0, 0, spriteCanvas.width, spriteCanvas.height);
    sctx.globalCompositeOperation = 'source-atop';

    if (isGold) {
      // diagonal multi-band gradient (dark gold -> bright highlight -> dark
      // gold, repeated) approximates how light catches brushed metal —
      // a flat color reads as "painted", banded light/dark reads as "metal"
      const w = spriteCanvas.width, h = spriteCanvas.height;
      const gradient = sctx.createLinearGradient(0, 0, w, h);
      gradient.addColorStop(0.00, '#6b4e02');
      gradient.addColorStop(0.18, '#caa53d');
      gradient.addColorStop(0.32, '#fff6d5');
      gradient.addColorStop(0.42, '#ffd700');
      gradient.addColorStop(0.55, '#8a6416');
      gradient.addColorStop(0.68, '#fff6d5');
      gradient.addColorStop(0.80, '#caa53d');
      gradient.addColorStop(1.00, '#5c4400');
      sctx.globalAlpha = 0.92;
      sctx.fillStyle = gradient;
      sctx.fillRect(0, 0, w, h);
    } else {
      const tintColor = `hsl(${Math.floor(Common.random(0, 360))}, 85%, 55%)`;
      sctx.globalAlpha = 0.5;
      sctx.fillStyle = tintColor;
      sctx.fillRect(0, 0, spriteCanvas.width, spriteCanvas.height);
    }
  }

  // gold plushies get a few twinkling sparkle glints (positions fixed at
  // spawn, drawn in the plushie's local space so they tumble along with it)
  let sparkles = null;
  if (isGold) {
    const count = Math.floor(Common.random(3, 5));
    sparkles = [];
    for (let i = 0; i < count; i++) {
      sparkles.push({
        ox: Common.random(-drawW * 0.32, drawW * 0.32),
        oy: Common.random(-drawH * 0.32, drawH * 0.32),
        phase: Common.random(0, Math.PI * 2),
        speed: Common.random(2.2, 4.2),
        size: Common.random(5, 9)
      });
    }
  }

  bodyMeta.set(body.id, { drawW, drawH, squash: 1, spriteCanvas, sparkles, isRareImage });
  spawnOrder.push(body);
  Composite.add(world, body);
}

Events.on(engine, 'collisionStart', (event) => {
  for (const pair of event.pairs) {
    const isGroundHit = pair.bodyA === ground || pair.bodyB === ground;
    for (const b of [pair.bodyA, pair.bodyB]) {
      const meta = bodyMeta.get(b.id);
      if (meta) {
        const speed = Math.min(Math.hypot(b.velocity.x, b.velocity.y), 18);
        if (speed > 1.5) {
          // ground landings squish a bit more than plushie-on-plushie bumps
          const strength = isGroundHit ? speed / 46 : speed / 60;
          meta.squash = Math.max(isGroundHit ? 0.85 : 0.9, 1 - strength);
        }
      }
    }
  }
});

// classic 4-point sparkle/glint shape (concave diamond), used for the
// twinkle effect on gold plushies
function drawSparkle(ctx, cx, cy, size, alpha) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#FFFDE7';
  ctx.shadowColor = '#FFF3B0';
  ctx.shadowBlur = size * 1.4;
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.quadraticCurveTo(size * 0.15, -size * 0.15, size, 0);
  ctx.quadraticCurveTo(size * 0.15, size * 0.15, 0, size);
  ctx.quadraticCurveTo(-size * 0.15, size * 0.15, -size, 0);
  ctx.quadraticCurveTo(-size * 0.15, -size * 0.15, 0, -size);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

let cameraZoom = 1; // eased camera zoom, adjusts when the pile outgrows the screen

// converts a screen-space point (e.g. a click) into world-space coordinates,
// accounting for the current camera zoom (needed since spawn points are
// captured from raw pointer events, but the camera may be zoomed out)
function screenToWorld(sx, sy) {
  const cx = canvas.width / 2, cy = canvas.height;
  return {
    x: (sx - cx) / cameraZoom + cx,
    y: (sy - cy) / cameraZoom + cy
  };
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const t = performance.now() / 1000; // seconds, used to animate the twinkle
  const bodies = Composite.allBodies(world);

  // camera zoom + wall-expansion only matters once the plushie cap is off
  // (unlimitedMode) — with the cap in place, 100 plushies never come close
  // to overflowing the screen, so this stays fully inactive until then.
  if (unlimitedMode) {
    // find how tall the current pile is (topmost edge of any plushie)
    const TOP_PADDING = 50;
    let topEdge = canvas.height;
    for (const body of bodies) {
      const meta = bodyMeta.get(body.id);
      if (!meta) continue;
      const extent = Math.max(meta.drawW, meta.drawH) / 2;
      const edge = body.position.y - extent;
      if (edge < topEdge) topEdge = edge;
    }
    const usedHeight = canvas.height - topEdge;
    let targetZoom = usedHeight > canvas.height - TOP_PADDING
      ? (canvas.height - TOP_PADDING) / usedHeight
      : 1;
    targetZoom = Math.max(0.28, Math.min(1, targetZoom));
    cameraZoom += (targetZoom - cameraZoom) * 0.06; // smooth ease toward target
    repositionWalls(); // move the actual physics walls outward to match

    // live plushie count — only write to the DOM when it actually changes
    if (spawnOrder.length !== lastPlushCountShown) {
      lastPlushCountShown = spawnOrder.length;
      plushCount.textContent = lastPlushCountShown;
    }
  }

  // zoom around the bottom-center, so the "ground" stays anchored in place
  // as everything scales down to fit
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height);
  ctx.scale(cameraZoom, cameraZoom);
  ctx.translate(-canvas.width / 2, -canvas.height);

  for (const body of bodies) {
    const meta = bodyMeta.get(body.id);
    if (!meta) continue;

    meta.squash += (1 - meta.squash) * 0.2;

    const { x, y } = body.position;
    const angle = body.angle;

    // world-aligned squash: flattens downward regardless of the
    // plushie's current tumble angle, so landings read as a real squish
    // against the floor instead of a squish along a spinning axis
    const scaleY = meta.squash;
    const scaleX = 1 + (1 - meta.squash) * 0.35;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, scaleY);
    ctx.rotate(angle);

    ctx.shadowColor = 'rgba(16,25,46,0.22)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 4;

    const baseImg = meta.isRareImage ? rareImg : img;
    const baseLoaded = meta.isRareImage ? rareImgLoaded : imgLoaded;

    if (baseLoaded) {
      const source = meta.spriteCanvas || baseImg;
      ctx.drawImage(source, -meta.drawW/2, -meta.drawH/2, meta.drawW, meta.drawH);

      if (meta.sparkles) {
        ctx.shadowOffsetY = 0; // don't inherit the plushie's drop-shadow offset
        for (const s of meta.sparkles) {
          // sine wave twinkle: only the positive half shows, so each
          // sparkle blinks on/off rather than just pulsing continuously
          const twinkle = Math.sin(t * s.speed + s.phase);
          const alpha = Math.max(0, twinkle) ** 2; // squared = snappier blink
          if (alpha > 0.04) {
            drawSparkle(ctx, s.ox, s.oy, s.size, alpha);
          }
        }
      }
    }

    ctx.restore();
  }

  ctx.restore(); // matches the camera-zoom save

  requestAnimationFrame(render);
}

const runner = Runner.create();
Runner.run(runner, engine);
render();

// --- UI wiring ---

// secret unlimited-mode toggle
const secretToggle = document.getElementById('secretToggle');
const secretToast = document.getElementById('secretToast');
let toastTimeout = null;

function showToast(text) {
  secretToast.textContent = text;
  secretToast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => secretToast.classList.remove('show'), 1800);
}

secretToggle.addEventListener('click', (e) => {
  e.stopPropagation(); // don't let this click also spawn a plushie on the canvas underneath
  if (unlimitedMode) return; // one-way switch — can't be turned back off
  unlimitedMode = true;
  showToast('Unlimited Natie Works');
  plushCounter.classList.add('show');
});

const HOLD_DELAY = 350;   // time holding before repeat-spawn kicks in
const SPAWN_COOLDOWN = 70; // ms between repeated spawns while holding

let holdTimeout = null;
let spawnInterval = null;
let lastPointer = { x: 0, y: 0 };
let activePointerId = null;

function startHold(x, y) {
  lastPointer.x = x;
  lastPointer.y = y;
  const world0 = screenToWorld(x, y);
  spawnObject(world0.x, world0.y); // immediate spawn on click

  holdTimeout = setTimeout(() => {
    spawnInterval = setInterval(() => {
      // horizontal jitter so repeated spawns spread out instead of
      // stacking nearly on top of each other (which causes a jarring
      // "pop apart" once the solver resolves the overlap)
      const jitter = Common.random(-60, 60);
      const w = screenToWorld(lastPointer.x + jitter, lastPointer.y);
      spawnObject(w.x, w.y);
    }, SPAWN_COOLDOWN);
  }, HOLD_DELAY);
}

function stopHold() {
  clearTimeout(holdTimeout);
  clearInterval(spawnInterval);
  holdTimeout = null;
  spawnInterval = null;
  activePointerId = null;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault(); // stop mobile browsers from treating this as a zoom/scroll gesture
  stopHold();          // force-clear any stuck state from a previous touch before starting fresh
  activePointerId = e.pointerId;
  startHold(e.clientX, e.clientY);
}, { passive: false });

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== activePointerId) return;
  e.preventDefault();
  lastPointer.x = e.clientX;
  lastPointer.y = e.clientY;
}, { passive: false });

function handlePointerEnd(e) {
  if (activePointerId !== null && e.pointerId !== activePointerId) return;
  stopHold();
}

canvas.addEventListener('pointerup', handlePointerEnd);
canvas.addEventListener('pointerleave', handlePointerEnd);
canvas.addEventListener('pointercancel', handlePointerEnd);

// safety nets: mobile browsers sometimes swallow pointerup/cancel events
// (e.g. when a system gesture interrupts the touch) without ever firing
// them on the canvas. These make sure holding never gets permanently stuck.
window.addEventListener('blur', stopHold);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopHold();
});
</script>
</body>
</html>
